<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Event Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="#" class="nav-brand">Event Admin</a>
        </div>

        <div class="nav-right">
            <span class="welcome-text">Welcome, Admin</span>
            <a href="/" class="btn-signin-outline btn-logout">Logout</a>
        </div>
    </nav>

    <!-- Konten Utama -->
    <div class="container">

        <div class="admin-header">
            <h1 class="page-title mb-0">Daftar Event</h1>
            <a href="create-event.html" class="btn-create">+ Buat Event Baru</a>
        </div>

        <table class="event-table">
            <thead>
                <tr>
                    <th class="col-no">No</th>
                    <th>Judul Event</th>
                    <th>Tanggal</th>
                    <th>Lokasi</th>
                    <th class="col-action">Aksi</th>
                </tr>
            </thead>
            <tbody id="eventTableBody">
                <!-- Data will be populated by JS -->
            </tbody>
        </table>

    </div>

    <!-- Popup untuk confirm delete -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeDeleteModal()">&times;</span>
            <h2 class="modal-title">Konfirmasi Hapus</h2>
            <p class="modal-description" id="deleteModalText">Apakah Anda yakin ingin menghapus event ini?</p>
            <div style='display:none' style="text-align: right; margin-top: 20px;">
                <button class="action-btn" onclick="closeDeleteModal()"
                    style="background-color: #6c757d; color: white; margin-right: 10px;">Batal</button>
                <button id="confirmDeleteBtn" class="action-btn btn-delete">Hapus</button>
            </div>
        </div>
    </div>

    <script>
        // Panggil api untuk list semua event
        fetch('/api/events')
            .then(response => response.json())
            .then(events => {
                const tbody = document.getElementById('eventTableBody');
                tbody.innerHTML = '';

                if (events.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Belum ada event.</td></tr>';
                    return;
                }

                events.forEach((event, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${event.title}</td>
                        <td>${event.date}</td>
                        <td>${event.location}</td>
                        <td>
                            <a href="edit-event.html?id=${event.id}" class="action-btn btn-edit">Edit</a>
                            <button type="button" style="display:none" class="action-btn btn-delete" onclick="deleteEvent(event, '${event.id}', '${event.title}')">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(err => console.error('Error loading events:', err));

        let eventIdToDelete = null;

        function deleteEvent(e, id, title) {
            e.preventDefault();
            eventIdToDelete = id;
            const modal = document.getElementById('deleteModal');
            const modalText = document.getElementById('deleteModalText');
            modalText.textContent = `Apakah Anda yakin ingin menghapus event "${title}"?`;
            modal.style.display = 'flex';

            // Untuk tombol hapus di popup confimation
            const confirmBtn = document.getElementById('confirmDeleteBtn');
            confirmBtn.onclick = function () {
                performDelete(eventIdToDelete);
            };
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            eventIdToDelete = null;
        }

        // Tutup popup ketika klik background
        window.onclick = function (event) {
            const modal = document.getElementById('deleteModal');
            if (event.target == modal) {
                closeDeleteModal();
            }
        }
        // Jalanin delete yang beneran
        function performDelete(id) {
            if (!id) return;

            fetch(`/api/events/${id}`, {
                method: 'DELETE'
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        // alert('Event berhasil dihapus');
                        location.reload();
                    } else {
                        alert('Gagal menghapus event');
                        closeDeleteModal();
                    }
                })
                .catch(err => {
                    alert('Error: ' + err);
                    closeDeleteModal();
                });
        }
    </script>

</body>

</html>
