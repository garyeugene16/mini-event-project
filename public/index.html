<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acara - Event Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="#" class="nav-brand">Event</a>
        </div>

        <div class="nav-right">
            <a href="login.html" class="btn-signin-outline">Sign in</a>
        </div>
    </nav>

    <!-- Konten Utama -->
    <div class="container">

        <h1 class="page-title">Acara</h1>

        <!-- Grid Event -->
        <div class="event-grid" id="eventGrid">
            
        </div>
    </div>

    <!-- Popup registrasi -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalEventTitle" class="modal-title">Daftar Event</h2>
            <p class="modal-description">Silahkan isi data diri Anda untuk mendaftar event ini.</p>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Nomor Telepon</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <button type="submit" class="btn-login btn-success">Daftar Sekarang</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById("registerModal");
        const modalTitle = document.getElementById("modalEventTitle");

        // Ambil event dari server
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/events')
                .then(res => res.json())
                .then(events => {
                    const grid = document.getElementById('eventGrid');
                    grid.innerHTML = '';

                    if (events.length === 0) {
                        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Belum ada event yang tersedia.</p>';
                        return;
                    }

                    events.forEach(event => {
                        const dateObj = new Date(event.date);
                        const month = dateObj.toLocaleString('id-ID', { month: 'short' }).toUpperCase();
                        const day = dateObj.getDate().toString().padStart(2, '0');

                        const card = document.createElement('div');
                        card.className = 'event-card';
                        card.innerHTML = `
                            <div class="card-image-wrapper">
                                <img src="${event.image}" alt="${event.title}" class="card-img" onerror="this.style.background='#ccc'">
                                <div class="date-badge">
                                    <span class="date-month">${month}</span>
                                    <span class="date-day">${day}</span>
                                </div>
                            </div>
                            <div class="card-content">
                                <div class="title-row">
                                    <h3 class="event-title">${event.title}</h3>
                                    <button class="btn-register" onclick="openModal('${event.title}')">Daftar</button>
                                </div>
                                <p style="font-size: 13px; color: #666; margin-bottom: 10px;">${event.location}</p>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(err => console.error('Error loading events:', err));
        });

        function openModal(title) {
            modalTitle.innerText = "Daftar: " + title;
            modal.style.display = "flex";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        window.onclick = function (event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById("name").value;
            const phone = document.getElementById("phone").value;
            const email = document.getElementById("email").value;
            const eventName = modalTitle.innerText.replace("Daftar: ", "");

            // Kirim data pendaftar ke server
            fetch('/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name, phone, email, eventName }),
            })
                .then(response => response.json())
                .then(data => {
                    alert("Pendaftaran Berhasil! Anda telah terdaftar di event " + eventName);
                    closeModal();
                    document.getElementById("registerForm").reset();
                })
                .catch((error) => {
                    console.error('Error:', error);
                    alert("Terjadi kesalahan saat mendaftar.");
                });
        }
    </script>
</body>

</html>
