<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Event Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <div class="login-card">

        <div class="card-header">
            <h2 class="login-title">LOGIN PAGE</h2>
            <div class="logos">
                <img src="images/logo.png" alt="Logo Unpar" class="logo-img">
            </div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">

            <div class="form-group">
                <label for="email">Username</label>
                <input type="text" id="email" name="email" placeholder="Username (admin)" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-login">Log In</button>

        </form>

        <script>
            function handleLogin(event) {
                event.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                // Kirim ke server dan cek
                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            window.location.href = '/admin-dashboard.html';
                        } else {
                            alert('Login Gagal: ' + data.message);
                        }
                    })
                    .catch(err => alert('Error: ' + err));
            }
        </script>
    </div>

</body>

</html>
