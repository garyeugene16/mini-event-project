<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Event Platform</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="login-body">
    <div class="login-card">
      <div class="card-header">
        <h2 class="login-title">LOGIN PAGE</h2>
        <div class="logos">
          <img src="images/logo.png" alt="Logo Unpar" class="logo-img" />
        </div>
      </div>

      <!-- ADD ID HERE SO JAVASCRIPT CAN FIND IT -->
      <form id="loginForm" action="#" method="POST">
        
        <div id="error-alert" 
             style="color: red; margin-bottom: 10px; display:none;">
            ❌ Email atau password salah!
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Alamat Email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
        </div>

        <button type="submit" id="btnLogin" class="btn-login">Log In</button>
      </form>
    </div>

    <script>
      // 1. Username & Password Hardcoded
      const ADMIN_EMAIL = "admin@gmail.com";
      const ADMIN_PASS = "123";

      // 2. Ambil elemen HTML
      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passInput = document.getElementById("password");
      const errorAlert = document.getElementById("error-alert");
      const btnLogin = document.getElementById("btnLogin");

      // 3. Event Listener
      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const emailValue = emailInput.value;
        const passValue = passInput.value;

        // Loading effect
        const originalText = btnLogin.innerText;
        btnLogin.innerText = "Loading...";
        btnLogin.disabled = true;

        setTimeout(() => {
          if (emailValue === ADMIN_EMAIL && passValue === ADMIN_PASS) {
            // LOGIN SUCCESS
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("adminName", "Super Admin");

            alert("Login Berhasil! Selamat datang, Admin.");
            window.location.href = "admin-create.html";
          } else {
            // LOGIN FAILED
            errorAlert.style.display = "block";

            btnLogin.innerText = originalText;
            btnLogin.disabled = false;

            passInput.value = "";
            passInput.focus();
          }
        }, 800);
      });
    </script>
  </body>
</html>
